<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex TCG</title>
<meta name="theme-color" content="#121316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=22">
<script>
(function(){try{var t=localStorage.getItem('pktcg.theme')||'dark',z=localStorage.getItem('pktcg.size')||'m';
if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-size',z);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Minha Pokédex</h1>
      <p id="h-sub">Coleção TCG</p>
    </div>
    <div class="right">
    <button class="icon-btn" id="btn-theme" aria-label="Alternar tema claro e escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="btn-scan" aria-label="Escanear cartas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="icon-btn" id="btn-search" aria-label="Buscar carta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    </div>
  </header>
  <div class="search" id="search" hidden>
    <input id="q" type="search" placeholder="Nome, número ou coleção" aria-label="Buscar" autocomplete="off">
  </div>
  <main id="app"></main>
</div>

<nav class="nav" aria-label="Principal">
  <ul>
    <li><button data-view="colecao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Coleção</button></li>
    <li><button data-view="vitrine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6"/></svg>Vitrine</button></li>
    <li><button data-view="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>Lista</button></li>
    <li><button data-view="mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>Mais</button></li>
  </ul>
</nav>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Carta ampliada" hidden>
  <div class="v-top">
    <button class="icon-btn" id="v-close" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span id="v-pos"></span>
    <span style="width:44px"></span>
  </div>
  <div class="stage" id="stage">
    <button class="icon-btn nav-arrow l" id="v-prev" aria-label="Carta anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="big" id="big"></div>
    <button class="icon-btn nav-arrow r" id="v-next" aria-label="Próxima carta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="v-info" id="v-info"></div>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="scan" id="scan" role="dialog" aria-modal="true" aria-label="Escanear cartas" hidden>
  <div class="sc-top">
    <button class="icon-btn" data-sc="close" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sc-seg" role="group" aria-label="Modo"><button data-scmode="one" aria-pressed="true">Uma carta</button><button data-scmode="seq" aria-pressed="false">Sequência</button></div>
    <span id="sc-count" class="sc-count"></span>
  </div>
  <div class="sc-cam off" id="sc-cam"><video id="sc-video" playsinline muted autoplay></video><div class="sc-guide" id="sc-guide"></div><canvas id="sc-frozen" hidden></canvas><p class="sc-hint">Encaixe a carta inteira na moldura, com boa luz e sem reflexo.</p></div>
  <div class="sc-panel" id="sc-panel"></div>
  <input type="file" id="sc-file" accept="image/*" capture="environment" hidden>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="data.js?v=22"></script>
<script src="db.js?v=22"></script>
<script src="app.js?v=22"></script>
</body>
</html>
